bookdown::gitbook:
  css: style.css
  split_by: section
  highlight: pygments
  config:
    toc:
      before: |
        <li><a href="./">A Technical Interview</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    edit: https://github.com/mcfongtw/CodingInterview/edit/master/%s
    download: ["pdf", "epub"]
bookdown::pdf_book:
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
  highlight: null
  pandoc_args: ["--syntax-highlighting=pygments"]
bookdown::epub_book:
  pandoc_args: ["--syntax-highlighting=pygments"]
